<!doctype html><html lang=zh-CN><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content="#F3F5F7">
<title>ECOS</title>
<script>
(function(){
  var p=localStorage.getItem('ecos-theme')||'auto';
  var night=p==='night'||(p!=='day'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=night?'night':'day';
})();
</script>
<style>
:root{
  --cobalt:#0A2A8C;--deep:#071C5C;--jiqing:#1F7A86;--ice:#D8E1F7;
  --paper:#EDEEF2;--white:#F8F8FA;--gray:#B8BCC4;--ink:#161A20;--dim:#5A6068;--lamp:3px;
  --face:#0A2A8C;--on:#FFFFFF;--mist:#D8E1F7;--tape:#071C5C;
  --grid-y:rgba(10,42,140,.04);--grid-x:rgba(10,42,140,.028);
  --shade:rgba(10,42,140,.08);--shade-sm:rgba(10,42,140,.06);
  --list:rgba(243,245,247,.7);
}
/* 夜航：墨底机匣，钴蓝印面与霁青灯不反相，字用纸灰减轻眩光 */
html[data-theme=night]{
  color-scheme:dark;
  --cobalt:#0A2A8C;--deep:#D2D8E8;--jiqing:#4EB8BE;--ice:#222836;
  --paper:#12151C;--white:#1B202C;--gray:#3D4452;--ink:#E4E6EC;--dim:#9098A4;
  --face:#B4C2EE;--on:#F3F5F8;--mist:#C5CEE4;--tape:#0A1020;
  --grid-y:rgba(110,150,220,.055);--grid-x:rgba(78,184,190,.035);
  --shade:rgba(0,0,0,.38);--shade-sm:rgba(0,0,0,.28);
  --list:rgba(12,15,22,.72);
}
*{box-sizing:border-box}
html{min-height:100%;color-scheme:light;background:
  repeating-linear-gradient(0deg,transparent 0 23px,var(--grid-y) 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,var(--grid-x) 24px),
  var(--paper)}
html[data-theme=night]{color-scheme:dark}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);
  font:14px/1.5 "PingFang SC","SF Pro Text",system-ui,-apple-system,sans-serif}
body:before{content:"";position:fixed;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--cobalt) 70%,var(--jiqing));z-index:4}
.shell{width:100%;padding:18px clamp(16px, 3vw, 48px) 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:10px 0 14px;border-bottom:2px solid var(--cobalt);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:28px;height:28px;background:var(--cobalt);
  box-shadow:inset var(--lamp) 0 0 0 var(--jiqing), 6px 6px 0 var(--mist)}
.brand b{display:block;font:16px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;font-weight:600;color:var(--deep)}
.brand span,.clock,#line{font:10px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--dim)}
.clock{flex:none}
.tools{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;justify-content:flex-end}
.foot{margin-top:28px;padding:16px 0 0;border-top:2px solid var(--cobalt);
  display:flex;justify-content:space-between;align-items:center;gap:16px}
.foot b{display:block;font:11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--deep);font-weight:600}
.foot span{display:block;margin-top:6px;font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--dim)}
.folio{font:10px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;color:var(--jiqing)}
.here{font:12px/1 "PingFang SC",system-ui,sans-serif;letter-spacing:.04em;color:var(--dim);white-space:nowrap}
.here.live{color:var(--jiqing)}
.tape{display:flex;align-items:stretch;margin:0 0 18px;min-height:34px;background:var(--tape);color:var(--mist);
  box-shadow:inset var(--lamp) 0 0 0 var(--jiqing), 4px 4px 0 var(--shade)}
.tape-tag{flex:none;background:var(--jiqing);color:var(--on);font:10px/1 ui-monospace,Menlo,monospace;
  letter-spacing:.2em;font-weight:700;padding:0 14px;display:flex;align-items:center}
.tape-view{flex:1;overflow:hidden;min-width:0}
.tape-track{display:flex;width:max-content;font:12px/34px ui-monospace,Menlo,monospace;animation:tape 42s linear infinite}
.tape-track span{white-space:nowrap;padding:0 22px}
.tape-track span:before{content:"// ";color:var(--jiqing)}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.desk{min-width:0}
#gate .panel{max-width:440px;padding:22px 22px 20px;
  box-shadow:8px 8px 0 var(--shade);border-left:4px solid var(--cobalt)}
#themeBtn{padding:8px 10px;letter-spacing:.08em}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.nav button,.key{appearance:none;border:0;cursor:pointer;border-radius:0;
  padding:10px 14px 10px 16px;background:var(--ice);color:var(--deep);
  font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;
  box-shadow:inset var(--lamp) 0 0 0 var(--gray)}
.nav button{padding-left:40px;position:relative}
.nav button:before{content:attr(data-n);position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:9px;letter-spacing:.08em;color:var(--jiqing)}
.nav button.on,.key.on{background:var(--cobalt);color:var(--on);box-shadow:inset var(--lamp) 0 0 0 var(--jiqing)}
.nav button.on:before{color:var(--mist)}
.key:hover,.nav button:hover{box-shadow:inset var(--lamp) 0 0 0 var(--jiqing)}
.panel{background:var(--white);border:1px solid var(--gray);padding:18px 18px 16px;
  box-shadow:4px 4px 0 var(--shade-sm)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:10px 16px;align-items:baseline}
.kv b{font:10px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--dim);font-weight:500}
.kv span{font:15px/1.35 ui-monospace,Menlo,monospace;color:var(--face)}
.list{border:1px solid var(--gray);background:var(--list);max-height:52vh;overflow:auto}
.row{padding:10px 12px;border-bottom:1px solid var(--gray)}
.row:last-child{border:0}
.row small{display:block;margin-top:3px;color:var(--dim);font:12px/1.4 ui-monospace,Menlo,monospace}
.log{max-height:52vh;overflow:auto;padding:2px 0 8px}
.say{padding:3px 0;line-height:1.55;font:15px/1.55 "PingFang SC","SF Pro Text",system-ui,sans-serif}
.say .n{color:var(--ink);font-weight:500}
.say .web{color:var(--dim);margin-right:6px;font:12px/1.55 ui-monospace,Menlo,monospace}
.say.sys,.say.cmd{color:var(--dim);font:13px/1.55 ui-monospace,Menlo,monospace}
.say.join{color:var(--jiqing)}
.say.quit,.say.death{color:var(--dim)}
.say.admin{color:var(--face)}
#ops{margin:16px 0 12px;padding:14px;border:1px solid var(--gray);background:var(--white);
  box-shadow:4px 4px 0 var(--shade-sm)}
#ops .list{max-height:160px;margin-bottom:10px}
.composer{display:flex;gap:8px;margin-top:12px;align-items:stretch;flex-wrap:nowrap}
.composer input{flex:1;min-width:0;width:auto}
#linkBtn{flex:none;padding:10px 12px;letter-spacing:.08em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.row.hit{cursor:pointer}
.row.hit:hover{background:var(--ice)}
.grid{display:grid;gap:12px}
input{width:100%;padding:12px 14px;background:var(--white);border:1px solid var(--gray);
  color:var(--ink);font:inherit;border-radius:0;letter-spacing:.2em}
input:focus{outline:2px solid var(--cobalt);border-color:var(--cobalt)}
#sayBox,#songQ{letter-spacing:0}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  background:var(--cobalt);color:var(--on);padding:8px 12px;display:none;z-index:9;
  font:12px ui-monospace,Menlo,monospace;box-shadow:4px 4px 0 var(--jiqing)}
iframe{width:100%;height:56vh;border:1px solid var(--gray);background:var(--white)}
.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar input{flex:1}
.pager{display:none;align-items:center;gap:10px;margin-top:10px}
.pager.on{display:flex}
.pager span{font:12px ui-monospace,Menlo,monospace;color:var(--dim)}
.pager button:disabled{opacity:.35;cursor:default}
.hint{color:var(--dim);font-size:13px;margin:0 0 12px}
.bye{margin-top:14px;background:transparent;color:var(--dim);box-shadow:none;border:1px solid var(--gray)}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid var(--gray)}
.me{display:flex;align-items:center;gap:16px;min-width:0}
.stage{flex:none;width:88px;height:118px;background:var(--ice);border:1px solid var(--gray);
  box-shadow:4px 4px 0 var(--shade)}
.stage canvas{display:block;width:88px;height:118px}
.hero h1{margin:0;font:600 28px/1.1 "PingFang SC",system-ui,sans-serif;color:var(--deep);letter-spacing:.02em}
.hero p{margin:6px 0 0;color:var(--dim)}
.hero p code{font:12px ui-monospace,Menlo,monospace;color:var(--face)}
.pill{flex:none;padding:8px 12px;background:var(--ice);color:var(--deep);
  font:11px ui-monospace,Menlo,monospace;letter-spacing:.12em;border-left:3px solid var(--jiqing)}
.pill.live{background:var(--cobalt);color:var(--on);border-left-color:var(--jiqing)}
.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
#ops .stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--white);border:1px solid var(--gray);padding:14px 14px 12px;border-left:4px solid var(--cobalt);
  box-shadow:3px 3px 0 var(--shade-sm)}
.stat b{display:block;font:10px/1.2 ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.12em}
.stat em{display:block;margin-top:10px;font:600 22px/1.1 ui-monospace,Menlo,monospace;font-style:normal;color:var(--face)}
.nowbox{margin-bottom:14px;border-left:4px solid var(--jiqing)}
.nowbox .mute{margin-top:12px}
.nowbox em{margin-top:6px;font-style:normal;font-size:16px;color:var(--deep)}
.nowcard{display:flex;gap:14px;align-items:flex-start}
.cover{width:80px;height:80px;flex:none;background:
  repeating-linear-gradient(45deg,var(--ice) 0 8px,var(--white) 8px 16px);object-fit:cover;display:block;
  box-shadow:4px 4px 0 var(--ice)}
.cover.off{display:none}
.meta b{display:block;font:600 18px/1.25 "PingFang SC",system-ui,sans-serif;color:var(--deep)}
.meta small{display:block;margin-top:4px;color:var(--dim);font:12px/1.4 ui-monospace,Menlo,monospace}
.ly{margin-top:14px;padding-top:12px;border-top:1px solid var(--gray)}
.ly .ln{display:block;line-height:1.45}
.ly .prev,.ly .next{color:var(--dim);font-size:13px}
.ly .cur{color:var(--face);font-size:18px;font-weight:500;margin:4px 0}
.ly .tr{color:var(--dim);font-size:13px}
.cap{font:10px/1 ui-monospace,Menlo,monospace;color:var(--dim);margin:0 0 8px;letter-spacing:.14em;
  display:flex;align-items:center;gap:8px}
.cap:before{content:"";width:18px;height:2px;background:var(--cobalt)}
.go{margin-top:10px}
.home2{grid-template-columns:1fr;align-items:stretch}
.home2 .col{display:flex;flex-direction:column;min-width:0;background:var(--white);
  border:1px solid var(--gray);padding:14px;box-shadow:4px 4px 0 var(--shade-sm)}
.home2 .log,.home2 .list{flex:1;min-height:168px;max-height:220px;margin:0}
.home2 .go{margin-top:12px;align-self:flex-start}
.row.who{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.row.who:not(:has(.head3d)){grid-template-columns:1fr}
.head3d{width:40px;height:40px;background:var(--ice);object-fit:contain}
main{min-width:0}

@media (min-width:860px){
  .shell{padding:22px clamp(20px, 3.5vw, 56px) 56px}
  .desk.live{display:grid;grid-template-columns:168px minmax(0,1fr);gap:clamp(18px, 2.5vw, 36px);align-items:start}
  .nav{flex-direction:column;flex-wrap:nowrap;margin:0}
  .nav button{text-align:left;padding:13px 14px 13px 40px}
  .kv{grid-template-columns:100px 1fr}
  .kv span{font-size:18px}
  .home2{grid-template-columns:minmax(0,1.4fr) minmax(240px,.85fr)}
  .grid.music{grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);align-items:start}
  .grid.map{grid-template-columns:minmax(0,1fr) minmax(220px,280px);align-items:stretch}
  .list,.log{max-height:calc(100vh - 240px)}
  #chat .log{max-height:calc(100vh - 200px)}
  iframe{height:calc(100vh - 180px)}
  .home2 .log,.home2 .list{max-height:min(360px,42vh)}
}
@media (min-width:1280px){
  .desk.live{grid-template-columns:188px minmax(0,1fr)}
  .home2{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
}

</style></head><body>
<div class=shell>
<div class=top>
  <div class=brand>
    <i class=mark></i>
    <div><b>// ECOS</b><span id=who>下午好</span></div>
  </div>
  <div class=tools>
    <span class=here id=here>尚未接入</span>
    <span class=folio id=ver>v—</span>
    <button class=key type=button id=themeBtn>随系统</button>
    <div class=clock id=clock></div>
  </div>
</div>
<div class=tape>
  <div class=tape-tag>播报</div>
  <div class=tape-view><div class=tape-track id=tapeTrack></div></div>
</div>
<div class=desk>
<nav class="nav hidden" id=nav>
  <button type=button data-p=home data-n=01 class=on>概览</button>
  <button type=button data-p=chat data-n=02>通讯</button>
  <button type=button data-p=music data-n=03>点歌</button>
  <button type=button data-p=map data-n=04>地图</button>
</nav>
<main>
<section id=gate>
  <div class=panel>
    <div class=hero>
      <div>
        <h1>接入终端</h1>
        <p>请在游戏中输入 <code>/ecos web</code>，取得六位连接码。两分钟内有效。</p>
      </div>
      <div class=pill>待接入</div>
    </div>
    <form id=pairForm>
      <input id=code maxlength=6 inputmode=numeric placeholder=000000 autocomplete=one-time-code>
      <button class="key on" style="width:100%;margin-top:12px" type=submit>接入</button>
    </form>
  </div>
</section>

<section id=home class=hidden>
  <div class=hero>
    <div class=me>
      <div class=stage><canvas id=skin3d width=88 height=118></canvas></div>
      <div>
        <h1 id=nm>--</h1>
        <p id=st>还没有写下签名</p>
      </div>
    </div>
    <div class=pill id=on>尚未进入游戏</div>
  </div>
  <div class="grid stats">
    <div class=stat><b>余额</b><em id=bal>--</em></div>
    <div class=stat><b>未读来信</b><em id=mailN>0</em></div>
    <div class=stat><b>签到</b><em id=chk>--</em></div>
    <div class=stat><b>在线人数</b><em id=pl>--</em></div>
  </div>
  <div class="panel nowbox">
    <div class=nowcard>
      <img class="cover off" id=coverHome alt="">
      <div class=meta>
        <b id=nowHome>--</b>
        <small id=nowHomeSub></small>
      </div>
    </div>
    <div class=ly id=lyHome></div>
    <p class=hint id=listenHint></p>
    <button class="key play hidden" type=button>在此聆听</button>
    <button class="key mute" type=button>暂停聆听</button>
    <div class=acts>
      <button class="key voteSong" type=button>投票切歌</button>
      <button class="key nextSong hidden" type=button>切到下一首</button>
    </div>
  </div>
  <div id=ops class=hidden>
    <div class=cap>管理处</div>
    <div class="grid stats">
      <div class=stat><b>TPS</b><em id=tps>--</em></div>
      <div class=stat><b>MSPT</b><em id=mspt>--</em></div>
    </div>
    <div class=cap>登录提醒</div>
    <div class=list id=logins></div>
    <div class=cap>审计记录</div>
    <div class=list id=logs></div>
  </div>
  <div class="grid home2">
    <div class=col>
      <div class=cap>通讯</div>
      <div class=log id=homeChat></div>
      <button class="key go" type=button data-go=chat>通讯</button>
    </div>
    <div class=col>
      <div class=cap>此刻在线</div>
      <div class=list id=homeWho></div>
      <button class="key go" type=button data-go=map>查看地图</button>
    </div>
  </div>
</section>
<section id=chat class=hidden>
  <div class=log id=chatList></div>
  <form id=sayForm class=composer>
    <button class="key hidden" type=button id=linkBtn>本服</button>
    <input id=sayBox maxlength=200 placeholder="写下想说的话，或以 / 开头输入指令" autocomplete=off>
    <button class="key on" type=submit>送出</button>
  </form>
</section>
<section id=music class=hidden>
  <div class="grid music">
    <div>
      <form id=searchForm class=searchbar>
        <input id=songQ placeholder="歌曲或歌手" autocomplete=off>
        <button class="key on" type=submit>查找</button>
      </form>
      <div class=list id=hits></div>
      <div class=pager id=pager>
        <button class=key type=button id=prevPage>上一页</button>
        <span id=pageInfo></span>
        <button class=key type=button id=nextPage>下一页</button>
      </div>
    </div>
    <div>
      <div class=panel style="margin-bottom:12px">
        <div class=nowcard>
          <img class="cover off" id=cover alt="">
          <div class=meta>
            <b id=now>--</b>
            <small id=nowSub></small>
          </div>
        </div>
        <div class=ly id=ly></div>
        <p class=hint id=listenHint2></p>
        <button class="key play hidden" type=button style="margin-top:12px">在此聆听</button>
        <button class="key mute" type=button style="margin-top:12px">暂停聆听</button>
        <div class=acts>
          <button class="key voteSong" type=button>投票切歌</button>
          <button class="key nextSong hidden" type=button>切到下一首</button>
        </div>
        <audio id=player preload=none></audio>
      </div>
      <div class=list id=queue></div>
    </div>
  </div>
</section>
<section id=map class=hidden>
  <div class="grid map">
    <iframe class=hidden id=mapFrame title=map></iframe>
    <div class=list id=roster></div>
  </div>
</section>
</main>
</div>
<footer class=foot>
  <div>
    <b>// ECOS</b>
    <span id=footVer>v—</span>
  </div>
  <div class=tools>
    <button class="key bye hidden" type=button id=bye>断开连接</button>
  </div>
</footer>
</div>
<div id=toast></div>
<script>
const $=s=>document.querySelector(s);
const KEY='ecos-web-token';
let page='home', hits=[], mapSrc='', chatHtml='', queueHtml='', rosterHtml='';
let me='', ver='', wantMute=false, lastUrl='', hereOnline=null, linkAll=false, saying=false;
function hello(name){
  const h=new Date().getHours();
  const g=h<5?'夜深了':h<9?'早上好':h<11?'上午好':h<14?'中午好':h<18?'下午好':h<22?'晚上好':'夜深了';
  return name?g+'，'+name:g;
}
function stopWebAudio(){
  const a=$('#player');
  a.pause();
  a.removeAttribute('src');
  lastUrl='';
  document.querySelectorAll('.play').forEach(b=>b.classList.add('hidden'));
}
function listenHint(on, muted){
  let t='';
  if(on) t='您正在游戏中，乐曲由客户端播放。';
  else if(muted) t='您已暂停聆听。';
  else t='您尚未进入游戏，可在此聆听。';
  const a=$('#listenHint'), b=$('#listenHint2');
  if(a) a.textContent=t;
  if(b) b.textContent=t;
}
function presence(online, muted){
  const on=!!online;
  const label=on?'正在游戏中':'尚未进入游戏';
  const here=$('#here'), pill=$('#on');
  if(here){here.textContent=me?label:'尚未接入';here.classList.toggle('live',on)}
  if(pill){pill.textContent=label;pill.classList.toggle('live',on)}
  listenHint(on, muted);
  if(hereOnline===false && on){
    stopWebAudio();
    toast('欢迎回来。网页已停止播放，请在游戏中聆听');
  }
  hereOnline=on;
}
function paintChrome(){
  const v=ver?'v'+ver:'v—';
  $('#who').textContent=hello(me);
  $('#ver').textContent=v;
  $('#footVer').textContent=v;
  if(!me){
    const here=$('#here');
    if(here){here.textContent='尚未接入';here.classList.remove('live')}
  }
}
function token(){return sessionStorage.getItem(KEY)||''}
function setTok(v){if(v)sessionStorage.setItem(KEY,v);else sessionStorage.removeItem(KEY)}
function headers(){const h={'Accept':'application/json'};if(token())h.Authorization='Bearer '+token();return h}
function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200)}
const THEME_KEY='ecos-theme';
function themePref(){return localStorage.getItem(THEME_KEY)||'auto'}
function themeNow(){
  const p=themePref();
  if(p==='night'||p==='day') return p;
  return matchMedia('(prefers-color-scheme: dark)').matches?'night':'day';
}
function applyTheme(){
  const t=themeNow();
  const p=themePref();
  document.documentElement.dataset.theme=t;
  const meta=$('meta[name=theme-color]');
  if(meta) meta.content=t==='night'?'#12151C':'#F3F5F7';
  const b=$('#themeBtn');
  if(b){
    b.textContent=p==='auto'?'随系统':t==='night'?'夜航':'纸面';
    b.classList.toggle('on', p!=='auto');
  }
}
function cycleTheme(){
  const order=['auto','day','night'];
  const i=order.indexOf(themePref());
  const next=order[(i<0?0:i+1)%3];
  localStorage.setItem(THEME_KEY,next);
  applyTheme();
  toast(next==='auto'?'已跟随系统外观':next==='night'?'已切换为夜航':'已切换为纸面');
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function show(p){
  page=p;
  ['home','chat','music','map'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==p));
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
}
function gated(on){
  $('#gate').classList.toggle('hidden',on);
  $('#nav').classList.toggle('hidden',!on);
  $('.desk').classList.toggle('live',on);
  $('#bye').classList.toggle('hidden',!on);
  if(on) show(page);
  else{
    me='';
    hereOnline=null;
    ['home','chat','music','map'].forEach(id=>$('#'+id).classList.add('hidden'));
  }
  paintChrome();
}
function setTape(items){
  const list=(items&&items.length)?items:['终端正在等候'];
  const html=list.map(s=>`<span>${esc(s)}</span>`).join('')+list.map(s=>`<span>${esc(s)}</span>`).join('');
  if($('#tapeTrack').dataset.k===html) return;
  $('#tapeTrack').dataset.k=html;
  $('#tapeTrack').innerHTML=html;
}
setTape();
function paintHits(d, empty){
  const list=d&&d.songs?d.songs:(Array.isArray(d)?d:[]);
  hits=list;
  if(!hits.length){
    $('#hits').innerHTML=`<div class=row>${esc(empty||'没有找到相符的歌曲')}</div>`;
    $('#pager').classList.remove('on');
    return;
  }
  $('#hits').innerHTML=hits.map((s,i)=>`<div class="row hit" data-i="${i}">${esc(s.name)}<small>${esc(s.author)}${s.album?' · '+esc(s.album):''}</small></div>`).join('');
  const pages=d.pages||0, page=d.page||1;
  if(pages>1){
    $('#pager').classList.add('on');
    $('#pageInfo').textContent=page+' / '+pages;
    $('#prevPage').disabled=!d.prev;
    $('#nextPage').disabled=!d.next;
  } else $('#pager').classList.remove('on');
}
function doSearch(body, empty){
  fetch('/v1/search',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      if(!d.ok){paintHits({}, d.error||'没有完成');toast(d.error||'查找没有完成，请稍后再试');return}
      paintHits(d, empty||'没有找到相符的歌曲');
    }).catch(()=>{paintHits({}, '暂时无法连接');toast('查找没有完成，请稍后再试')});
}
function streamSrc(d){
  if(d.online||d.muted||!d.url) return '';
  return d.url+(d.url.includes('?')?'&':'?')+'token='+encodeURIComponent(token());
}
function syncAudio(d){
  const a=$('#player');
  wantMute=!!d.muted;
  const muted=wantMute;
  document.querySelectorAll('.mute').forEach(b=>{
    b.textContent=muted?'已暂停聆听':'暂停聆听';
    b.classList.toggle('on', muted);
  });
  presence(!!d.online, muted);
  const src=streamSrc(d);
  document.querySelectorAll('.play').forEach(b=>b.classList.toggle('hidden',!src));
  if(!src){
    stopWebAudio();
    return;
  }
  if(lastUrl!==src){
    lastUrl=src;
    a.src=src;
    a.play().catch(()=>{});
  }
}
function songLine(now){
  if(!now||!now.name||now.name==='（无）') return '此刻没有乐曲';
  return (now.author?now.author+' / ':'')+now.name;
}
function nowSub(now){
  if(!now||!now.name||now.name==='（无）') return '';
  const bits=[];
  if(now.album) bits.push(now.album);
  bits.push(now.caller?'由 '+now.caller+' 点播':'正在播放空闲曲目');
  return bits.join(' · ');
}
function lyHtml(now){
  if(!now||(!now.lyric&&!now.prev&&!now.next)) return '';
  return (now.prev?`<span class="ln prev">${esc(now.prev)}</span>`:'')
    +`<span class="ln cur">${esc(now.lyric||'…')}</span>`
    +(now.tlyric?`<span class="ln tr">${esc(now.tlyric)}</span>`:'')
    +(now.next?`<span class="ln next">${esc(now.next)}</span>`:'');
}
function setCover(el, url){
  if(!el) return;
  if(!url){el.removeAttribute('src');el.classList.add('off');return}
  if(el.dataset.u!==url){el.dataset.u=url;el.onerror=()=>el.classList.add('off');el.src=url}
  el.classList.remove('off');
}
function paintNow(now){
  const sl=songLine(now);
  const sub=nowSub(now);
  $('#now').textContent=sl;
  $('#nowHome').textContent=sl;
  $('#nowSub').textContent=sub;
  $('#nowHomeSub').textContent=sub;
  setCover($('#cover'), now&&now.pic);
  setCover($('#coverHome'), now&&now.pic);
  const ly=lyHtml(now);
  if($('#ly').dataset.k!==ly){$('#ly').dataset.k=ly;$('#ly').innerHTML=ly}
  if($('#lyHome').dataset.k!==ly){$('#lyHome').dataset.k=ly;$('#lyHome').innerHTML=ly}
}
function kindOf(l){return l.kind||(l.web?'web':'chat')}
function sayLine(l){
  const k=kindOf(l);
  if(k==='web'||l.web) return `<div class="say web"><span class=web>[Web]</span><span class=n>&lt;${esc(l.name)}&gt;</span> ${esc(l.text)}</div>`;
  if(k==='chat') return `<div class=say><span class=n>&lt;${esc(l.name)}&gt;</span> ${esc(l.text)}</div>`;
  return `<div class="say ${esc(k)}">${esc(l.text)}</div>`;
}
function headUrl(p){
  if(p&&p.head) return p.head;
  const n=p&&p.name?p.name:'Steve';
  return 'https://mc-heads.net/head/'+encodeURIComponent(n)+'/80';
}
function skinUrl(d){
  if(d&&d.skin) return d.skin;
  const n=d&&d.name?d.name:'Steve';
  return 'https://mc-heads.net/skin/'+encodeURIComponent(n);
}
let skinViewer=null, skinKey='';
function paintSkin(d){
  const url=skinUrl(d);
  if(!window.skinview3d||!window.skinview3d.SkinViewer) return;
  const canvas=$('#skin3d');
  if(!canvas) return;
  if(!skinViewer){
    skinViewer=new skinview3d.SkinViewer({canvas,width:88,height:118,skin:url});
    skinViewer.autoRotate=true;
    skinViewer.autoRotateSpeed=.5;
    try{skinViewer.animation=new skinview3d.WalkingAnimation()}catch(e){}
    if(skinViewer.controls) skinViewer.controls.enableZoom=false;
  }else if(skinKey!==url){
    skinViewer.loadSkin(url);
  }
  skinKey=url;
}
function whoRow(p){
  return `<div class="row who"><img class=head3d alt="" src="${esc(headUrl(p))}" onerror="this.remove()"><div>${esc(p.name)}<small>${esc(p.world)}  ${p.x} ${p.y} ${p.z}${p.ip?' · '+esc(p.ip):''}</small></div></div>`;
}
function paint(d){
  me=d.name||'';
  if(d.version) ver=d.version;
  paintChrome();
  $('#nm').textContent=d.name||'--';
  paintSkin(d);
  $('#bal').textContent=d.balance||'--';
  $('#mailN').textContent=d.mail??0;
  $('#chk').textContent=d.checked?'今日已签到 · 连签 '+(d.streak??0)+' 日':'今日尚未签到';
  $('#pl').textContent=d.players??(d.who||[]).length;
  $('#st').textContent=d.status||'还没有写下签名';
  syncAudio(d);
  paintNow(d.now);
  setTape(d.tape);
  const chat=(d.chat||[]).map(sayLine).join('')||'<div class=say>暂时还没有新的消息</div>';
  if(chat!==chatHtml){
    const box=$('#chatList');
    const stick=box.scrollHeight-box.scrollTop-box.clientHeight<48;
    chatHtml=chat;box.innerHTML=chat;
    if(stick||box.scrollTop===0) box.scrollTop=box.scrollHeight;
  }
  const queue=(d.queue||[]).map(s=>`<div class=row>${esc(s.name)}<small>${esc(s.author)}${s.album?' · '+esc(s.album):''}${s.caller?' · 由 '+esc(s.caller)+' 点播':''}</small></div>`).join('')||'<div class=row>点播队列还是空的</div>';
  if(queue!==queueHtml){queueHtml=queue;$('#queue').innerHTML=queue}
  const roster=(d.who||[]).map(whoRow).join('')||'<div class=row>此刻没有人在线</div>';
  if(roster!==rosterHtml){rosterHtml=roster;$('#roster').innerHTML=roster;$('#homeWho').innerHTML=roster}
  const hc=(d.chat||[]).slice(-5).map(sayLine).join('')||'<div class=say>暂时还没有新的消息</div>';
  $('#homeChat').innerHTML=hc;
  const ops=$('#ops');
  if(ops){
    ops.classList.toggle('hidden',!d.admin);
    if(d.admin){
      $('#tps').textContent=d.tps!=null?Number(d.tps).toFixed(2):'--';
      $('#mspt').textContent=d.mspt!=null?Number(d.mspt).toFixed(1):'--';
      const kinds={NEW_IP:'更换了地址',FAIL:'未能进入',WEB_NEW:'网页使用了新地址',PROBE:'握手后未进入'};
      $('#logins').innerHTML=(d.logins||[]).slice().reverse().map(e=>`<div class=row>${esc(e.name)} · ${esc(kinds[e.kind]||e.kind)}<small>${esc(e.ip||'')}${e.note?' · '+esc(e.note):''}</small></div>`).join('')||'<div class=row>目前没有需要留意的登录</div>';
      $('#logs').innerHTML=(d.logs||[]).slice().reverse().map(s=>`<div class=row><small>${esc(s)}</small></div>`).join('')||'<div class=row>审计记录尚未开启</div>';
    }
  }
  if(d.map && d.map!==mapSrc){
    mapSrc=d.map;
    $('#mapFrame').src=d.map;
    $('#mapFrame').classList.remove('hidden');
  }
  linkAll=!!d.link;
  const linkBtn=$('#linkBtn');
  if(linkBtn){
    linkBtn.classList.toggle('hidden',!d.hasLink);
    linkBtn.classList.toggle('on',linkAll);
    linkBtn.textContent=linkAll?'互通':'本服';
  }
  document.querySelectorAll('.nextSong').forEach(b=>b.classList.toggle('hidden',!d.admin));
}
let deskBusy=false, nowBusy=false;
function pull(){
  if(!token()){gated(false);return}
  if(deskBusy)return;
  deskBusy=true;
  fetch('/v1/desk',{headers:headers()}).then(r=>{
    if(r.status===401){setTok('');gated(false);toast('连接已失效，请重新接入');throw 0}
    return r.json();
  }).then(d=>{gated(true);paint(d)}).catch(()=>{}).finally(()=>{deskBusy=false});
}
function pullNow(){
  if(!token()||nowBusy)return;
  nowBusy=true;
  fetch('/v1/now',{headers:headers()}).then(r=>{
    if(r.status===401)return;
    return r.json();
  }).then(d=>{
    if(!d||!d.ok) return;
    if('online' in d){
      presence(d.online, wantMute);
      if(d.online) stopWebAudio();
    }
    paintNow(d.now);
  }).catch(()=>{}).finally(()=>{nowBusy=false});
}
$('#pairForm').onsubmit=e=>{
  e.preventDefault();
  fetch('/v1/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('#code').value.trim()})}
  ).then(r=>r.json()).then(d=>{
    if(!d.ok){toast(d.error||'接入没有完成，请再试一次');return}
    setTok(d.token);pull();
  }).catch(()=>toast('暂时无法连接，请稍后再试'));
};
$('#searchForm').onsubmit=e=>{
  e.preventDefault();
  const q=$('#songQ').value.trim();
  if(!q){toast('请先写下歌曲或歌手');return}
  paintHits({}, '正在查找…');
  doSearch({q});
};
$('#prevPage').onclick=()=>doSearch({dir:'prev'});
$('#nextPage').onclick=()=>doSearch({dir:'next'});
$('#hits').onclick=e=>{
  const row=e.target.closest('[data-i]');
  if(!row)return;
  const s=hits[+row.dataset.i];
  if(!s||!s.id)return;
  fetch('/v1/music',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({id:s.id})}
  ).then(r=>r.json()).then(d=>{toast(d.ok?'已为您点播 '+(s.name||''):(d.error||'点播没有完成，请稍后再试'));if(d.ok)pull()}).catch(()=>toast('点播没有完成，请稍后再试'));
};
let tabHints=[], tabI=-1, tabBase='';
function applyHint(base, hint){
  const i=base.lastIndexOf(' ');
  $('#sayBox').value=i<0?('/'+hint):(base.slice(0,i+1)+hint);
}
$('#sayBox').addEventListener('keydown', e=>{
  if(e.key!=='Tab'){tabHints=[];return}
  const t=$('#sayBox').value;
  if(!t.startsWith('/')) return;
  e.preventDefault();
  if(tabHints.length){
    tabI=(tabI+1)%tabHints.length;
    applyHint(tabBase, tabHints[tabI]);
    return;
  }
  fetch('/v1/complete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({text:t})})
    .then(r=>r.json()).then(d=>{
      tabHints=d&&d.hints?d.hints:[];
      tabI=0;
      tabBase=t;
      if(!tabHints.length) return;
      applyHint(t, tabHints[0]);
      if(tabHints.length>1) toast(tabHints.slice(0,8).join('  '));
    }).catch(()=>{});
});
$('#sayForm').onsubmit=e=>{
  e.preventDefault();
  if(saying)return;
  const text=$('#sayBox').value.trim();
  if(!text)return;
  saying=true;
  fetch('/v1/chat',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({text})}
  ).then(r=>r.json()).then(d=>{
    if(!d.ok){toast(d.error||'这条消息没有送出');return}
    $('#sayBox').value='';
    if(d.command&&d.replies&&d.replies.length) toast(d.replies[0]);
    pull();
  }).catch(()=>toast('这条消息没有送出')).finally(()=>saying=false);
};
$('#linkBtn').onclick=()=>{
  fetch('/v1/link',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({all:!linkAll})}
  ).then(r=>r.json()).then(d=>{
    if(!d.ok){toast(d.error||'未能切换发送范围');return}
    linkAll=!!d.link;
    $('#linkBtn').classList.toggle('on',linkAll);
    $('#linkBtn').textContent=linkAll?'互通':'本服';
    toast(linkAll?'此后发往互通服':'此后仅本服可见');
  }).catch(()=>toast('未能切换发送范围'));
};
function musicAct(action, okMsg){
  fetch('/v1/music',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({action})}
  ).then(r=>r.json()).then(d=>toast(d.ok?(d.msg||okMsg):(d.error||'没有完成，请稍后再试'))).catch(()=>toast('没有完成，请稍后再试'));
}
document.querySelectorAll('.voteSong').forEach(b=>b.onclick=()=>musicAct('vote','已投下切歌一票'));
document.querySelectorAll('.nextSong').forEach(b=>b.onclick=()=>musicAct('next','已切到下一首'));
document.querySelectorAll('.play').forEach(b=>b.onclick=()=>{
  const a=$('#player');
  if(!a.src){toast('此刻没有正在播放的歌曲');return}
  a.play().catch(()=>toast('请再点一次「在此聆听」'));
});
document.querySelectorAll('.mute').forEach(b=>b.onclick=()=>{
  wantMute=!wantMute;
  const a=$('#player');
  if(wantMute){a.pause();a.removeAttribute('src');lastUrl=''}
  document.querySelectorAll('.mute').forEach(x=>{
    x.textContent=wantMute?'已暂停聆听':'暂停聆听';
    x.classList.toggle('on', wantMute);
  });
  fetch('/v1/mute',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({muted:wantMute})})
    .then(()=>pull()).catch(()=>{});
});
$('#themeBtn').onclick=cycleTheme;
if(window.matchMedia){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
    if(themePref()==='auto') applyTheme();
  });
}
applyTheme();
$('#bye').onclick=()=>{fetch('/v1/logout',{method:'POST',headers:headers()}).finally(()=>{$('#player').pause();setTok('');gated(false)})};
$('#nav').onclick=e=>{const b=e.target.closest('[data-p]');if(b)show(b.dataset.p)};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
function tick(){
  $('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  paintChrome();
}
setInterval(tick,1000);tick();
fetch('/v1/info').then(r=>r.json()).then(d=>{if(d&&d.version){ver=d.version;paintChrome()}}).catch(()=>{});
paintHits({});
(function(){
  const q=new URLSearchParams(location.search).get('code')||'';
  const digits=q.replace(/\D/g,'').slice(0,6);
  if(digits){
    $('#code').value=digits;
    if(digits.length===6 && !token()) $('#pairForm').requestSubmit();
  }
})();
pull();setInterval(pull,4000);setInterval(pullNow,1000);
</script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.3.0/bundles/skinview3d.bundle.js" onload="if(token())pull()"></script>
</body></html>
