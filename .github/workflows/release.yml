name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "target/ES2UniPlugin-${VER}.jar" \
            --title "ES2UniPlugin ${VER}" \
            --notes "$(cat <<'EOF'
          房产系统（和领地分开）：3D 房间门牌，住宅 / 公共 / 商业。登记、牌子（ES2注册单位）、门口传送、挂牌买卖。

          看房：终端房产页左键传到门口，潜行左键两次购买（15 秒确认）。
          /ecos estate here 查看当前门牌。ECOS 终端改为分类翻页（概览/社交/出行/城市/娱乐/管理）。
          EOF
          )"
