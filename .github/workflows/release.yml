name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "target/ES2UniPlugin-${VER}.jar" \
            --title "ES2UniPlugin ${VER}" \
            --notes "$(cat <<'EOF'
          ECOS 终端改为 27 格：分类图标常驻、当前页发光，标题带页名。去掉黑玻璃和灰染料占位。

          霁弧 Gleam Arc 可 /ecos weapon bind gleam_arc（右键释放）；skill grant + 潜行+F 仍可用。
          EOF
          )"
